<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>P2P AI Assistant</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f7f7f8;
    color: #222;
}

header {
    background: #0A1931;
    color: #FFD700;
    padding: 18px;
    font-size: 21px;
    font-weight: bold;
    text-align: center;
}

#chat {
    height: calc(100vh - 145px);
    overflow-y: auto;
    padding: 20px 15px;
}

.message {
    max-width: 85%;
    padding: 13px 16px;
    margin-bottom: 15px;
    border-radius: 15px;
    line-height: 1.5;
    white-space: pre-wrap;
}

.bot {
    background: white;
    border: 1px solid #ddd;
    margin-right: auto;
}

.user {
    background: #0A1931;
    color: white;
    margin-left: auto;
}

.input-area {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    background: white;
    padding: 12px;
    display: flex;
    gap: 8px;
    border-top: 1px solid #ddd;
}

input {
    flex: 1;
    padding: 14px;
    border: 1px solid #ccc;
    border-radius: 25px;
    outline: none;
    font-size: 15px;
}

button {
    background: #0A1931;
    color: #FFD700;
    border: none;
    border-radius: 25px;
    padding: 12px 20px;
    font-weight: bold;
}
</style>
</head>

<body>
    <a href="page1.html" style="display:inline-block; padding:10px 20px; background:#0a1931; color:#ffcc00; text-decoration:none; border-radius:8px; font-weight:bold;">
  ← Go back to home
    </a>

<header>🤖 P2P AI Assistant</header>

<div id="chat">
    <div class="message bot">
        Hello! 👋 I am P2P Bot.

        I was created by a Nigerian student who loves Liverpool FC and Free Fire.

        How can I help you today?
    </div>
</div>

<div class="input-area">
    <input id="userInput" placeholder="Message P2P Bot..." />
    <button onclick="sendMessage()">Send</button>
</div>

<script>const chat = document.getElementById("chat");
const input = document.getElementById("userInput");

let history = [];

function addMessage(message, sender) {
    const div = document.createElement("div");

    div.textContent = message;
    div.style.padding = "12px";
    div.style.margin = "10px 0";
    div.style.borderRadius = "12px";
    div.style.maxWidth = "85%";
    div.style.whiteSpace = "pre-wrap";

    if (sender === "user") {
        div.style.background = "#dbeafe";
        div.style.marginLeft = "auto";
    } else {
        div.style.background = "#eeeeee";
        div.style.marginRight = "auto";
    }

    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;

    return div;
}

async function sendMessage() {
    const question = input.value.trim();

    if (!question) return;

    addMessage(question, "user");

    input.value = "";
    input.disabled = true;

    const loading = addMessage("P2P Bot is thinking...", "bot");

    try {
        const response = await fetch("/.netlify/functions/chat", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                message: question,
                history: history
            })
        });

        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.error || "Connection failed");
        }

        loading.remove();

        addMessage(data.reply, "bot");

        history.push(
            { role: "user", text: question },
            { role: "model", text: data.reply }
        );

        history = history.slice(-10);

    } catch (error) {
        loading.textContent = "Sorry! I couldn't connect. " + error.message;
    }

    input.disabled = false;
    input.focus();
}

input.addEventListener("keydown", function(event) {
    if (event.key === "Enter") {
        sendMessage();
    }
});
</script>

</body>
</html>
